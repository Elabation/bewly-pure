<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#241b21">
  <title>每日视频目录</title>
  <style>:root {
  color-scheme: dark;
  --paper: #241b21;
  --panel: #2a2026;
  --ink: #f5e9e7;
  --muted: #d7bdc3;
  --line: #b0928470;
  --pink: #ee9fbe;
  --blue: #78bad7;
  --yellow: #f4cf65;
  --red: #cf6964;
  font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  font-synthesis: none;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); font-size: 14px; line-height: 1.55; isolation: isolate; }
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1;
  background: linear-gradient(180deg,#281d2670,#22182042 60%,#21171e28),
    url("assets/livehouse-room-v8.webp") center / cover no-repeat;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
a { color: inherit; text-decoration: none; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
  outline: 2px solid var(--pink); outline-offset: 3px;
}
.hero {
  --pull: 0;
  --rest: clamp(205px, 19vw, 330px);
  --travel: clamp(120px, 12vw, 220px);
  height: calc(var(--rest) + var(--pull) * var(--travel));
  position: relative; overflow: hidden; overflow-anchor: none;
  transition: height .38s cubic-bezier(.2,.83,.32,1);
  isolation: isolate;
}
.hero-art {
  position: absolute; width: 100%; height: 100%; inset: 0;
  object-fit: cover; object-position: 50% calc(38% - var(--pull) * 3%);
}
.hero::after {
  position: absolute; content: ""; inset: 0; pointer-events: none;
  background: linear-gradient(0deg,#24191f 0,#24191f99 12px,transparent 47px),
    linear-gradient(#21192188,transparent 64px);
}
.top {
  position: relative; z-index: 1; width: min(100% - 64px, 1680px); margin: auto;
  min-height: 45px; display: flex; align-items: center; justify-content: space-between;
  color: #fff2f5; font-size: 11px;
}
.clip-mark { display: flex; gap: 4px; transform: rotate(-11deg); }
.clip-mark i { width: 11px; height: 11px; border-radius: 1px; background: var(--blue); box-shadow: 1px 2px #20182266; }
.clip-mark i:last-child { background: var(--yellow); transform: translateY(5px); }
.shell { width: min(100% - 64px, 1680px); margin: 0 auto; position: relative; }
.control-band {
  background: #24191f; border-bottom: 1px solid #aa7e6680;
  margin-bottom: 16px; box-shadow: 0 10px 22px #1d141a60;
}
.controls {
  display: flex; justify-content: space-between; align-items: center; gap: 14px;
  width: min(100% - 64px, 1680px); margin: auto; padding: 0 10px;
}
.tabs { display: flex; gap: 18px; }
.tabs button, .calendar-panel button, .record-panel button, .utility button, .pager button {
  border: 0; background: none;
}
.tabs button { padding: 13px 0 11px; border-bottom: 2px solid transparent; color: var(--muted); white-space: nowrap; }
.tabs button.on { border-color: var(--pink); color: var(--ink); }
.tabs button { position: relative; }
.saved-clip { display: none; position: absolute; right: -7px; top: 6px; width: 7px; height: 7px; background: var(--blue); rotate: -14deg; box-shadow: 5px 3px 0 var(--yellow); }
[data-filled=true] .saved-clip { display: block; }
.searchbox { width: min(270px, 40%); position: relative; }
.searchbox span { position: absolute; inset: 5px auto auto 8px; color: var(--muted); }
.searchbox input { width: 100%; border: 1px solid var(--line); border-radius: 3px; padding: 5px 8px 5px 25px; background: #20181c; font-size: 12px; }
.catalog-layout { display: grid; grid-template-columns: minmax(0,1fr) 234px; gap: 18px; align-items: start; }
.catalog-main, .calendar-panel, .record-panel { border: 1px solid var(--line); }
.catalog-main { min-width: 0; padding: 14px 17px; --muted: #ead5db; background: linear-gradient(90deg,#21192059,#21192080 55%); }
.section-heading { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
.section-heading h2, .calendar-heading h3, .record-heading h3 { margin: 0; font-weight: 600; }
.section-heading h2 { font-size: 17px; }
.section-heading p { margin: 2px 0 0; }
.section-heading p, .page-label, .notice { color: var(--muted); font-size: 12px; }
.notice:empty { display: none; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 18px 12px; }
.card { min-width: 0; }
.cover { display: block; overflow: hidden; border-radius: 3px; aspect-ratio: 16 / 10; position: relative; background: #483039; }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.duration, .corner { position: absolute; font-size: 10px; background: #262027d9; color: #fff; border-radius: 2px; padding: 1px 5px; }
.duration { bottom: 5px; right: 5px; font-variant-numeric: tabular-nums; }
.corner { left: 5px; top: 5px; }
.card-title { font-size: 14px; font-weight: 400; line-height: 1.48; margin: 7px 0 4px; min-height: 2.96em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-title:hover, .card-actions button:hover, .utility a:hover { color: var(--pink); }
.card-meta, .card-actions { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; color: var(--muted); font-size: 11px; }
.card-meta .owner { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-meta > :last-child, .card-actions button { flex-shrink: 0; }
.card-actions { margin-top: 3px; font-size: 10px; }
.card-actions button { border: 0; background: none; padding: 2px 0 2px 5px; }
.empty { grid-column: 1 / -1; padding: 28px 0; color: var(--muted); }
.search-empty { display: grid; justify-items: center; gap: 8px; padding: 24px 0 18px; }
.search-empty svg { width: 112px; height: auto; }
.search-empty p { margin: 0; color: var(--ink); }
.search-empty button { border: 0; background: none; padding: 4px 8px; color: var(--muted); font-size: 12px; text-decoration: underline; text-underline-offset: 4px; }
.search-empty button:hover { color: var(--pink); }
.pager { display: flex; justify-content: center; align-items: center; margin-top: 18px; gap: 3px; }
.pager button, .pager span { min-width: 36px; min-height: 34px; display: grid; place-items: center; }
.pager button { border: 1px solid var(--line); border-radius: 50%; background: #3b2a34; font-size: 17px; }
.pager button:not(:disabled):hover { background: #654254; }
.pager button:disabled { color: #9a7d87; background: transparent; border-color: transparent; }
.pager span { padding: 0 13px; font-variant-numeric: tabular-nums; color: var(--muted); }
.catalog-aside { display: grid; gap: 13px; min-width: 0; }
.calendar-panel {
  --stub-height: 37px;
  --tear-line: calc(var(--stub-height) + 1px);
  padding: 13px 12px 0; position: relative; border-radius: 5px;
  background: repeating-linear-gradient(0deg,#d7b58b05 0 1px,transparent 1px 4px),linear-gradient(148deg,#40302e,#302324 69%);
  mask:
    radial-gradient(circle at left calc(100% - var(--tear-line)),transparent 5px,#000 5.6px),
    radial-gradient(circle at right calc(100% - var(--tear-line)),transparent 5px,#000 5.6px),
    linear-gradient(#000 0 0) top / 100% calc(100% - var(--tear-line) - 4px) no-repeat,
    linear-gradient(#000 0 0) bottom / 100% calc(var(--tear-line) - 4px) no-repeat,
    radial-gradient(circle,transparent 1.25px,#000 1.75px) center bottom calc(var(--tear-line) - 4px) / 7px 8px repeat-x;
  mask-composite: intersect, intersect, add, add;
}
.calendar-heading, .record-heading, .calendar-month, .calendar-selected, .music-times, .music-bottom { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.calendar-heading {
  min-height: 48px; margin: -13px -12px 8px; padding: 0 12px; border-radius: 4px 4px 0 0;
  border-bottom: 1px solid #b18767;
  background: linear-gradient(90deg,#211719f5 0%,#2117194d 52%,transparent 77%),
    url("assets/calendar-ticket-v1.jpg") right 72% / cover no-repeat #211719;
}
.calendar-heading h3, .record-heading h3 { font-size: 13px; }
.calendar-month strong { font-weight: 600; font-variant-numeric: tabular-nums; }
.calendar-month button { min-width: 28px; min-height: 27px; font-size: 19px; color: var(--muted); }
.calendar-month button:disabled { opacity: .32; }
.calendar-week, .calendar-days { display: grid; grid-template-columns: repeat(7,minmax(0,1fr)); text-align: center; gap: 1px; }
.calendar-week { color: var(--muted); font-size: 10px; margin: 5px 0 2px; }
.calendar-days button, .calendar-blank { min-height: 25px; font-size: 11px; position: relative; z-index: 0; font-variant-numeric: tabular-nums; }
.calendar-days button:disabled { color: #af939b; }
.calendar-days button.has-entry::before { content: ""; position: absolute; z-index: -1; inset: 2px 3px; border: 1px solid #bf8a8990; border-radius: 2px; rotate: -6deg; background: #b86c6a10; }
.calendar-days button.has-entry { color: #f3d6c2; }
.calendar-days button.chosen { color: #ffe0d1; font-weight: 600; }
.calendar-days button.chosen::before { border: 1px solid #e0a1a4; box-shadow: inset 0 0 0 2px #40302e,inset 0 0 0 3px #e0a1a440; background: #bf777836; }
.calendar-days button.last-ticket::after { content: ""; position: absolute; width: 6px; height: 6px; right: 2px; top: 1px; background: linear-gradient(225deg,#e1b890 0 49%,#644c3b 51%); clip-path: polygon(0 0,100% 100%,0 100%); }
.calendar-days .band-date { box-shadow: inset 0 -2px var(--band); }
.band-date.hitori { --band: #d998b7; }
.band-date.kita { --band: var(--red); }
.band-date.nijika { --band: var(--yellow); }
.band-date.ryo { --band: var(--blue); }
.calendar-occasion { color: #ebc2a0; font-size: 10px; margin: 8px 0 0; }
.calendar-occasion button { padding: 0; color: inherit; text-align: left; }
.calendar-occasion button:hover { color: var(--pink); }
.calendar-selected { height: var(--stub-height); margin: 10px -12px 0; padding: 0 11px; background: #503a31; border-radius: 0 0 4px 4px; color: #f3d7ba; font-size: 11px; }
.calendar-selected .ticket-stamp { display: flex; align-items: baseline; gap: 7px; font-variant-numeric: tabular-nums; }
.ticket-stamp > span { border: 1px solid #d3aa8a76; padding: 1px 3px; font-size: 10px; letter-spacing: .025em; rotate: -2deg; }
.ticket-stamp small { font-size: 10px; }
.ticket-notch { display: block; margin-left: auto; width: 5px; height: 14px; background: repeating-linear-gradient(0deg,#d3aa8a77 0 1px,transparent 1px 3px); }
.calendar-selected button { color: #f4c9a8; padding: 0; }
.record-panel { padding: 12px; background: linear-gradient(135deg,#43303b28,transparent 50%),#251b23ed; border-radius: 4px; box-shadow: inset 0 1px #d3bbad16,0 3px 8px #18101922; }
.record-heading { margin-bottom: 10px; }
.audio-meter { width: 36px; height: 13px; display: flex; align-items: end; gap: 2px; }
.audio-meter i { width: 3px; height: 100%; background: #ccae87; transform-origin: bottom; transform: scaleY(calc(.08 + var(--v0,0)*.92)); transition: transform .09s linear; opacity: .75; }
.audio-meter i:nth-child(2) { transform: scaleY(calc(.08 + var(--v1,0)*.92)); }
.audio-meter i:nth-child(3) { transform: scaleY(calc(.08 + var(--v2,0)*.92)); }
.audio-meter i:nth-child(4) { transform: scaleY(calc(.08 + var(--v3,0)*.92)); }
.audio-meter i:nth-child(5) { transform: scaleY(calc(.08 + var(--v4,0)*.92)); }
.audio-meter i:nth-child(6) { transform: scaleY(calc(.08 + var(--v5,0)*.92)); }
.audio-meter i:nth-child(7) { transform: scaleY(calc(.08 + var(--v6,0)*.92)); }
.record-panel label, .music-message { font-size: 10px; color: var(--muted); }
.turntable { aspect-ratio: 216 / 192; overflow: hidden; position: relative; background: linear-gradient(135deg,#523a40,#2f252a 73%); border-radius: 3px; box-shadow: inset 0 0 0 1px #876b6e, inset 0 -3px #181419; }
.turntable-plate {
  position: absolute; left: 5.56%; top: 5.21%; width: 75.93%; aspect-ratio: 1; border-radius: 50%;
  background: repeating-radial-gradient(circle,#6b5a5a 0 1px,#3f3438 1.5px 2px);
  box-shadow: inset 0 0 0 1px #b29b92, inset 0 0 0 3px #44363c, 0 5px 12px #100a0ebf;
}
.vinyl { width: 98%; height: 98%; margin: 1%; border-radius: 50%; display: grid; place-items: center; animation: vinyl 6s linear infinite paused; background: conic-gradient(from 26deg,#ddd0bc00,#d8b9a23b 26deg,#fff0 48deg,#fff0 174deg,#bca2aa4f 211deg,#fff0 238deg),repeating-radial-gradient(circle,#191519 0 1px,#322a30 1.5px 2px,#211b21 2.5px 3px); transition: opacity .22s,translate .22s cubic-bezier(.2,.7,.2,1); }
.turntable[data-changing=true] .vinyl { opacity: 0; translate: -25% -6%; transition-delay: .1s; }
.record-label { position: relative; width: 45%; aspect-ratio: 1; display: grid; place-items: center; overflow: hidden; border-radius: 50%; background: #7e576c; box-shadow: 0 0 0 1px var(--side-color,#9b7d80), 0 0 0 4px #171319; }
.record-label img { position: absolute; width: 100%; height: 100%; object-fit: cover; }
.record-label::after { content: ""; position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 12px #22131d55; }
.turntable-plate::after { content: ""; position: absolute; top: 50%; left: 50%; translate: -50% -50%; width: 5px; height: 5px; border-radius: 50%; background: #c5b3aa; box-shadow: 0 1px 2px #140e14; }
.deck-hardware { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.arm-base { fill: #33272c; stroke: #967d76; stroke-width: 1.5; }
.arm-rest { fill: #54434a; stroke: #ad9690; stroke-width: 1.5; stroke-linecap: round; }
.tonearm { transform-origin: 193px 29px; transform: rotate(-8deg); transition: transform .44s cubic-bezier(.24,.68,.24,1) .16s; }
.tonearm > path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.arm-shadow { stroke: #1a1118; stroke-width: 7; translate: 2px 3px; opacity: .7; transition: translate .16s, opacity .16s; }
.arm-shaft { stroke: #b0a3a1; stroke-width: 4.5; }
.arm-highlight { stroke: #e7d8c9; stroke-width: 1; }
.counterweight { fill: #6e6063; stroke: #b6a29a; }
.arm-bearing { fill: #6c5a60; stroke: #d1bfb2; }
.headshell rect { fill: #54444e; stroke: #bca9a2; }
.headshell path { fill: none; stroke: #cbaca5; stroke-linecap: round; }
.stylus-tip { fill: #f6cfa1; opacity: .42; transition: opacity .16s; }
.arm-cued .tonearm { transform: rotate(var(--arm-angle,18deg)); transition-delay: 0s; }
.arm-down .arm-shadow { translate: 1px 1px; opacity: .45; transition-delay: .32s; }
.arm-down .stylus-tip { opacity: 1; transition-delay: .32s; }
.power-led { position: absolute; left: 12px; bottom: 7px; width: 4px; height: 4px; border-radius: 50%; background: #786873; }
.deck-side { position: absolute; bottom: 6px; right: 9px; font-size: 9px; color: var(--side-color,#ead0ba); letter-spacing: .07em; }
.deck-strobe { position: absolute; left: 18px; bottom: 6px; width: 36px; height: 3px; background: repeating-linear-gradient(90deg,#a58d9e 0 1px,transparent 1px 4px); }
.playing .vinyl { animation-play-state: running; }
.arm-cued .power-led { background: #f3ae80; box-shadow: 0 0 5px #e98d6e; }
@keyframes vinyl { to { transform: rotate(360deg); } }
.music-sleeve { display: flex; align-items: center; gap: 10px; margin: 13px 0 9px; min-width: 0; }
.music-sleeve img { width: 64px; height: 64px; flex: 0 0 64px; object-fit: cover; background: #4d3243; border: 1px solid #dacdb150; box-shadow: 2px 1px #221a21,3px 2px #9b83794a,5px 4px 8px #120c1380; }
.music-sleeve div { min-width: 0; }
.music-sleeve strong, .music-sleeve small { display: block; overflow-wrap: anywhere; }
.music-sleeve strong { font-size: 11px; font-weight: 600; }
.music-sleeve small { font-size: 10px; color: var(--muted); }
.music-transport { display: flex; justify-content: center; align-items: center; gap: 12px; margin: 5px 0; }
.music-transport button { width: 30px; height: 30px; font-size: 16px; color: var(--ink); }
.music-transport #music-play { border-radius: 50%; background: #e7a2be; color: #311d2a; font-size: 13px; }
.record-panel input[type=range] { display: block; width: 100%; height: 4px; accent-color: var(--pink); margin: 6px 0; }
.music-times { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.music-bottom { margin-top: 6px; }
.music-bottom label { display: flex; gap: 5px; align-items: center; white-space: nowrap; }
.music-bottom #music-volume { width: 42px; }
.music-queue { margin-top: 9px; border-top: 1px solid #9c78745c; }
.music-queue summary { display: flex; align-items: center; gap: 6px; padding: 8px 0 0; cursor: pointer; font-size: 12px; }
.music-queue summary::-webkit-details-marker { display: none; }
.music-queue summary span { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); }
.music-queue summary::after { content: ""; width: 5px; height: 5px; border: solid #e6b9c9; border-width: 0 1px 1px 0; rotate: 45deg; margin: -3px 3px 0 2px; }
.music-queue[open] summary::after { rotate: 225deg; margin-top: 2px; }
#music-track { max-block-size: 260px; overflow: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: #815664 #21181f; }
.track-side { margin: 10px 0 0; padding: 8px; background: linear-gradient(100deg,#48313b35,transparent),#21181f; border: 1px solid #99726d30; box-shadow: 0 2px 0 #171017,inset 0 1px #bb97871a; }
.album-jacket { display: flex; align-items: center; gap: 9px; padding-bottom: 7px; border-bottom: 1px solid #99726d25; }
.album-jacket img { width: 48px; height: 48px; object-fit: cover; border: 1px solid #e5cdb340; box-shadow: 2px 2px #a48a7330; }
.track-side h4 { padding: 0; margin: 0; color: #e6cebf; font-size: 10px; font-weight: 400; overflow-wrap: anywhere; }
.track-side-a, .turntable[data-side=A] { --side-color: var(--pink); }
.track-side-b, .turntable[data-side=B] { --side-color: var(--yellow); }
.track-side-c, .turntable[data-side=C] { --side-color: var(--blue); }
.track-side-d, .turntable[data-side=D] { --side-color: #e69288; }
.track-side ul { margin: 0; padding: 0; list-style: none; }
.track-side button { width: 100%; display: grid; grid-template-columns: 24px minmax(0,1fr); gap: 4px; min-height: 31px; padding: 6px 2px; align-items: baseline; text-align: left; font-size: 11px; line-height: 1.4; overflow-wrap: anywhere; }
.track-side button span { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 10px; }
.track-side button[aria-current=true] { background: #4b303f; color: #ffdfec; }
.track-side button:hover { background: #513543; }
.music-message { margin: 4px 0 0; }
.music-message:empty { display: none; }
.footer { padding: 12px 10px 26px; margin-top: 15px; background: #221920dd; color: var(--muted); font-size: 11px; }
.footer details { margin-bottom: 7px; }
.footer summary { cursor: pointer; }
.utility { display: flex; flex-wrap: wrap; gap: 7px 13px; }
.utility button, .filelabel { padding: 0; cursor: pointer; }
.jump-end { position: fixed; z-index: 3; right: 17px; bottom: 16px; width: 35px; height: 35px; border: 1px solid #aa7d8e; border-radius: 50%; background: #36262f; color: #f0bfd1; display: grid; place-items: center; box-shadow: 0 3px 9px #140a14aa; }
.jump-end svg { width: 16px; height: 16px; }
dialog { width: min(480px,92vw); border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); }
dialog::backdrop { background: #251b27a8; }
dialog h3, dialog p { margin: 0 0 9px; }
dialog label { display: block; margin-top: 6px; }
dialog select, dialog textarea { width: 100%; border: 1px solid var(--line); background: #20171e; padding: 6px; }
dialog textarea { min-height: 74px; resize: vertical; }
.form-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.dialog-actions { display: flex; gap: 6px; margin-top: 9px; }
.dialog-actions button { border: 1px solid var(--line); border-radius: 4px; background: #48303d; padding: 5px 7px; }
@media (min-width: 1160px) { .grid { grid-template-columns: repeat(4, minmax(0,1fr)); } }
@media (min-width: 1440px) { .grid { grid-template-columns: repeat(5, minmax(0,1fr)); } }
@media (max-width: 950px) {
  .top, .shell, .controls { width: calc(100% - 32px); }
  .grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
}
@media (max-width: 670px) {
  .hero { --rest: 180px; --travel: 115px; }
  .hero-art { object-position: 64% 38%; }
  .top, .shell, .controls { width: calc(100% - 22px); }
  .controls { padding: 0 8px; gap: 8px; }
  .tabs { gap: 9px; font-size: 11px; }
  .searchbox { width: 46%; }
  .catalog-layout { grid-template-columns: minmax(0,1fr); gap: 12px; }
  .catalog-main { padding: 12px 9px; }
  .catalog-aside { grid-template-columns: 1fr 1fr; gap: 8px; align-items: start; }
  .record-panel, .calendar-panel { min-width: 0; }
  .music-sleeve { gap: 6px; }
  .music-sleeve img { width: 42px; height: 42px; flex-basis: 42px; }
  .music-sleeve strong { font-size: 10px; }
  .music-sleeve small { font-size: 9px; }
  .calendar-selected { padding: 0 7px; }
  .calendar-selected .ticket-stamp { display: block; }
  .ticket-stamp small { display: block; font-size: 9px; }
  .ticket-stamp > span { font-size: 9px; padding: 0 2px; }
  .ticket-notch { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .hero, .tonearm, .arm-shadow, .stylus-tip { transition: none; }
  .vinyl { animation: none; }
  .vinyl, .audio-meter i { transition: none; }
}

$('export').addEventListener('click',()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(documentForExport(),null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='制作与共鸣标注.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
$('import').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const clean=validate(JSON.parse(await file.text()));remember();Object.assign(reviews,clean);persist();await render();$('message').textContent='已导入 '+Object.keys(clean).length+' 条标注。';}catch(error){$('message').textContent='导入失败：'+error.message;}e.target.value='';});
$('undo').addEventListener('click',()=>{if(!history.length){$('message').textContent='暂无可撤销的判断。';return;}reviews=Object.assign(Object.create(null),JSON.parse(history.pop()));persist();render();});
$('updated').textContent = '更新 ' + BOOT.generated_at.slice(0, 16);
$('collection-note').textContent = BOOT.collection
  ? '最近采集完成于 ' + date(BOOT.collection.finished_at.slice(0, 8)) + '，新发现热门 ' + BOOT.collection.new_videos + ' 条。'
  : '本期使用已有采集数据。';
if (!BOOT.curated) {
  $('search').setAttribute?.('aria-label', '搜索样本目录');
}
show(BOOT.initial.map(unpack),BOOT.streams.daily.count);
paintSavedClip();


// Calendar, a scroll-responsive cover, and the turntable.
const calendarDates=Object.keys(BOOT.calendar||{}).sort();
const bandDates = {
  '0221': ['后藤一里生日', 'hitori'],
  '0421': ['喜多郁代生日', 'kita'],
  '0529': ['伊地知虹夏生日', 'nijika'],
  '0918': ['山田凉生日', 'ryo'],
  '1225': ['首张专辑数字发行纪念日', 'hitori']
};
let calendarMonth=(activeDay||BOOT.generated_at.slice(0,7).replace('-','')).slice(0,6);
const calendarUnit = BOOT.curated ? '部入选' : '条候选';
let lastTicket = '';
try { lastTicket = localStorage.getItem('bili_last_ticket') || ''; } catch {}
function rememberTicket(day) {
 lastTicket = day;
 try { localStorage.setItem('bili_last_ticket', day); } catch {}
}
function paintCalendar(){
 const year=Number(calendarMonth.slice(0,4)),month=Number(calendarMonth.slice(4,6)),offset=(new Date(year,month-1,1).getDay()+6)%7,days=new Date(year,month,0).getDate();
 $('calendar-month').textContent=year+' / '+String(month).padStart(2,'0');
 let html=Array.from({length:offset},()=>'<span class="calendar-blank"></span>').join('');
 for (let day = 1; day <= days; day++) {
   const key = calendarMonth + String(day).padStart(2, '0');
   const count = (BOOT.calendar || {})[key] || 0;
   const occasion = bandDates[key.slice(4)];
   const label = count + calendarUnit + (occasion ? ' · ' + occasion[0] : '');
   const classes = [key === activeDay ? 'chosen' : '', count ? 'has-entry' : '', count && key === lastTicket ? 'last-ticket' : '', occasion ? 'band-date ' + occasion[1] : ''].join(' ');
   html += `<button data-day="${key}" ${count ? '' : 'disabled'} class="${classes}" aria-pressed="${key === activeDay}" aria-label="${year}年${month}月${day}日，${label}" title="${label}">${day}</button>`;
 }
 $('calendar-days').innerHTML=html;$('calendar-selected-date').textContent=activeDay?date(activeDay):'暂无上架';$('calendar-selected-count').textContent=((BOOT.calendar||{})[activeDay]||0)+' '+calendarUnit;
 const dates = Object.entries(bandDates).sort();
 const monthEvent = dates.find(([day]) => day.slice(0, 2) === calendarMonth.slice(4));
 const upcoming = dates.find(([day]) => day.slice(0, 2) > calendarMonth.slice(4)) || dates[0];
 const occasion = $('calendar-occasion');
 occasion.hidden = false;
 occasion.innerHTML = monthEvent
   ? `${Number(monthEvent[0].slice(2))} 日 · ${monthEvent[1][0]}`
   : `<button data-occasion-month="${upcoming[0].slice(0, 2)}">${upcoming[0].slice(0, 2)}/${upcoming[0].slice(2)} · ${upcoming[1][0]}</button>`;
 const buildYear = Number(BOOT.generated_at.slice(0, 4));
 const firstYear = calendarDates.length ? Number(calendarDates[0].slice(0, 4)) : buildYear;
 $('calendar-prev').disabled = calendarMonth <= Math.min(buildYear - 1, firstYear) + '01';
 $('calendar-next').disabled = calendarMonth >= (buildYear + 1) + '12';
}
function moveMonth(step){const y=Number(calendarMonth.slice(0,4)),m=Number(calendarMonth.slice(4,6)),d=new Date(y,m-1+step,1);calendarMonth=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0');paintCalendar();if(!window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)$('calendar-days').animate?.([{opacity:.25,transform:`translateX(${step*5}px)`},{opacity:1,transform:'translateX(0)'}],{duration:180});}
$('calendar-prev').addEventListener('click',()=>moveMonth(-1));$('calendar-next').addEventListener('click',()=>moveMonth(1));
$('calendar-occasion').addEventListener('click', event => {
  const month = event.target.closest('[data-occasion-month]')?.dataset.occasionMonth;
  if (!month) return;
  calendarMonth = calendarMonth.slice(0, 4) + month;
  paintCalendar();
});
$('calendar-days').addEventListener('click',e=>{const b=e.target.closest('[data-day]');if(!b||b.disabled)return;activeDay=b.dataset.day;rememberTicket(activeDay);tab='daily';page=0;query='';$('search').value='';clearTimeout(searchTimer);paintCalendar();render();});
$('calendar-today').addEventListener('click',()=>{if(!BOOT.latest_day)return;activeDay=BOOT.latest_day;rememberTicket(activeDay);calendarMonth=activeDay.slice(0,6);tab='daily';page=0;query='';$('search').value='';clearTimeout(searchTimer);paintCalendar();render();});
paintCalendar();

const hero = $('interactive-hero');
const expandThreshold = 44;
let wheelPull = 0;
function resetHero() {
  if (!wheelPull) return;
  wheelPull = 0;
  hero.style.setProperty('--pull', '0');
}
window.addEventListener('wheel', event => {
  if (event.ctrlKey || event.shiftKey || Math.abs(event.deltaX) > Math.abs(event.deltaY)) return;
  if (event.deltaY > 0) {
    resetHero();
    return;
  }
  if (event.deltaY >= 0 || window.scrollY > 1 || wheelPull >= expandThreshold) return;
  const units = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? window.innerHeight : 1;
  wheelPull = Math.min(expandThreshold, wheelPull - event.deltaY * units);
  const stretch = wheelPull === expandThreshold ? 1 : .48 * wheelPull / expandThreshold;
  hero.style.setProperty('--pull', String(stretch));
}, {passive: true});
window.addEventListener('scroll', () => {
  if (window.scrollY > 1) resetHero();
}, {passive: true});
$('jump-end').addEventListener('click', () => {
  resetHero();
  window.scrollTo(0, document.documentElement.scrollHeight);
});

const audio = $('music-audio');
const deck = $('turntable');
const trackList = $('music-track');
const musicTracks = BOOT.music || [];
let trackIndex = 0;
let changeTimer = 0, cueTimer = 0, pendingPlay = false, changingTrack = false;
let audioContext, analyser, meterFrame = 0;
const meter = $('audio-meter');
function stopMeter() {
  if (meterFrame) cancelAnimationFrame(meterFrame);
  meterFrame = 0;
  if (meter) for (let i = 0; i < 7; i++) meter.style.setProperty('--v' + i, '0');
}
function prepareMeter() {
  const AudioEngine = window.AudioContext || window.webkitAudioContext;
  if (!AudioEngine) return;
  try {
    if (!audioContext) {
      audioContext = new AudioEngine();
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 256;
      const source = audioContext.createMediaElementSource(audio);
      source.connect(analyser);
      analyser.connect(audioContext.destination);
    }
    audioContext.resume().catch(() => {});
  } catch { /* Playback remains available without a meter. */ }
}
function startMeter() {
  if (!analyser || !meter || document.hidden || meterFrame) return;
  const bins = new Uint8Array(analyser.frequencyBinCount);
  let last = 0;
  const draw = now => {
    if (audio.paused || document.hidden) { stopMeter(); return; }
    if (now - last > 90) {
      analyser.getByteFrequencyData(bins);
      for (let i = 0; i < 7; i++) {
        const from = Math.floor(1 + i * i * 1.7), to = Math.min(bins.length, Math.floor(4 + (i + 1) * (i + 1) * 1.7));
        let sum = 0;
        for (let j = from; j < to; j++) sum += bins[j];
        meter.style.setProperty('--v' + i, String(sum / Math.max(1, to - from) / 255));
      }
      last = now;
    }
    meterFrame = requestAnimationFrame(draw);
  };
  meterFrame = requestAnimationFrame(draw);
}
document.addEventListener?.('visibilitychange', () => { if (document.hidden) stopMeter(); else if (!audio.paused) startMeter(); });

const musicTime = seconds => Number.isFinite(seconds)
  ? Math.floor(seconds / 60) + ':' + String(Math.floor(seconds % 60)).padStart(2, '0')
  : '—';

function musicList() {
  const groups = new Map();
  musicTracks.forEach((track, index) => {
    const key = track.art || track.album;
    if (!groups.has(key)) groups.set(key, {track, items: []});
    groups.get(key).items.push(`<li><button type="button" data-track="${index}" aria-current="false"><span>${esc(track.side + track.number)}</span>${esc(track.title)}</button></li>`);
  });
  trackList.innerHTML = Array.from(groups.values(), ({track, items}) =>
    `<section class="track-side track-side-${esc(track.side.toLowerCase())}"><div class="album-jacket">${track.art ? `<img src="${esc(track.art)}" alt="${esc(track.album)}封面" width="64" height="64" loading="lazy">` : ''}<h4>${esc(track.album)}</h4></div><ul>${items.join('')}</ul></section>`
  ).join('');
  $('music-count').textContent = String(musicTracks.length).padStart(2, '0');
}

function paintTrack(track) {
  $('music-title').textContent = track.title;
  const edition = track.album === track.title ? '单曲' : track.album;
  $('music-album').textContent = edition + ' · ' + track.side + track.number;
  deck.dataset.side = track.side;
  $('deck-side').textContent = track.side + track.number;
  for (const id of ['record-art', 'sleeve-art']) {
    const image = $(id);
    image.hidden = !track.art;
    if (track.art && image.getAttribute('src') !== track.art) image.src = track.art;
  }
  for (const button of trackList.querySelectorAll('[data-track]')) {
    button.setAttribute('aria-current', String(Number(button.dataset.track) === trackIndex));
  }
}

function paintTransport(active) {
  $('music-play').textContent = active ? 'Ⅱ' : '▶';
  $('music-play').setAttribute('aria-label', active ? '暂停' : '播放');
}

function parkArm() {
  clearTimeout(cueTimer);
  deck.classList.remove('playing', 'arm-down', 'arm-cued');
  paintTransport(false);
  stopMeter();
}

function paintProgress() {
  const duration = audio.duration;
  const fraction = Number.isFinite(duration) && duration > 0
    ? Math.min(1, audio.currentTime / duration) : 0;
  $('music-elapsed').textContent = musicTime(audio.currentTime);
  $('music-seek').value = String(fraction * 1000);
  deck.style.setProperty('--arm-angle', (18 + fraction * 10) + 'deg');
}

function startMusic() {
  prepareMeter();
  audio.play().catch(error => {
    if (error.name === 'AbortError') return;
    parkArm();
    $('music-message').textContent = '音频未能播放，请再试一次。';
  });
}

function loadTrack(index, play = false) {
  if (!musicTracks.length) return;
  clearTimeout(changeTimer);
  changingTrack = true;
  pendingPlay = play;
  audio.pause();
  parkArm();
  trackIndex = (index + musicTracks.length) % musicTracks.length;
  deck.dataset.changing = 'true';
  $('music-queue').dataset.changing = 'true';
  paintTransport(play);
  changeTimer = setTimeout(() => {
  const track = musicTracks[trackIndex];
  audio.src = track.src;
  paintTrack(track);
  $('music-message').textContent = '';
  $('music-seek').value = '0';
  $('music-seek').disabled = true;
  $('music-elapsed').textContent = '0:00';
  $('music-duration').textContent = '—';
  deck.style.setProperty('--arm-angle', '18deg');
  deck.dataset.changing = 'false';
  $('music-queue').dataset.changing = 'false';
  changingTrack = false;
  if (pendingPlay) startMusic();
  }, 360);
}

audio.addEventListener('play', () => {
  paintTransport(true);
  deck.classList.add('arm-cued');
});
audio.addEventListener('playing', () => {
  deck.classList.add('playing', 'arm-cued');
  clearTimeout(cueTimer);
  cueTimer = setTimeout(() => { if (!audio.paused) deck.classList.add('arm-down'); }, 340);
  startMeter();
  $('music-message').textContent = '';
});
audio.addEventListener('waiting', () => {
  if (audio.paused) return;
  deck.classList.remove('playing');
  stopMeter();
  $('music-message').textContent = '正在缓冲…';
});
audio.addEventListener('pause', () => {
  if (!audio.paused) return;
  clearTimeout(cueTimer);
  deck.classList.remove('playing', 'arm-down');
  paintTransport(false);
  stopMeter();
  $('music-message').textContent = '';
});
audio.addEventListener('error', () => {
  parkArm();
  $('music-message').textContent = '音频加载失败，请重试或换一首。';
});
audio.addEventListener('loadedmetadata', () => {
  $('music-duration').textContent = musicTime(audio.duration);
  $('music-seek').disabled = !Number.isFinite(audio.duration);
  paintProgress();
});
audio.addEventListener('timeupdate', paintProgress);
audio.addEventListener('ended', () => loadTrack(trackIndex + 1, true));
audio.volume = .25;

$('music-play').addEventListener('click', () => {
  if (!musicTracks.length) return;
  prepareMeter();
  if (changingTrack) { pendingPlay = !pendingPlay; paintTransport(pendingPlay); return; }
  if (!audio.paused) {
    audio.pause();
  } else if (!audio.src || audio.error) {
    loadTrack(trackIndex, true);
  } else {
    startMusic();
  }
});
$('music-prev').addEventListener('click', () => { prepareMeter(); loadTrack(trackIndex - 1, changingTrack ? pendingPlay : !audio.paused); });
$('music-next').addEventListener('click', () => { prepareMeter(); loadTrack(trackIndex + 1, changingTrack ? pendingPlay : !audio.paused); });
trackList.addEventListener('click', event => {
  const button = event.target.closest('[data-track]');
  if (!button) return;
  const index = Number(button.dataset.track);
  prepareMeter();
  if (index !== trackIndex || !audio.src || audio.error) loadTrack(index, true);
  else if (audio.paused) startMusic();
});
$('music-seek').addEventListener('input', () => {
  if (Number.isFinite(audio.duration) && audio.duration > 0) {
    audio.currentTime = Number($('music-seek').value) / 1000 * audio.duration;
    paintProgress();
  }
});
$('music-volume').addEventListener('input', () => { audio.volume = Number($('music-volume').value); });
musicList();
if (musicTracks.length) {
  paintTrack(musicTracks[0]);
  $('music-seek').disabled = true;
} else {
  $('music-queue').hidden = true;
  for (const id of ['music-prev', 'music-play', 'music-next', 'music-seek', 'music-volume']) $(id).disabled = true;
  $('music-message').textContent = '暂无曲目';
}
</script>
