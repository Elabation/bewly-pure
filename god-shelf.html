<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4ebed">
  <title>每日视频目录</title>
  <style>:root {
  color-scheme: light;
  --paper: #f4ebed;
  --panel: #fff9fa;
  --ink: #31272f;
  --muted: #74616c;
  --line: #ddcdd5;
  --pink: #a34f77;
  --blue: #78bad7;
  --yellow: #f4cf65;
  --red: #cf6964;
  font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  font-synthesis: none;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); font-size: 14px; line-height: 1.55; }
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1;
  background: url("assets/livehouse-room-v6.webp") center / cover no-repeat;
  opacity: .13;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
a { color: inherit; text-decoration: none; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--pink); outline-offset: 3px;
}
.hero {
  --pull: 0;
  --rest: clamp(205px, 17vw, 280px);
  --travel: clamp(120px, 12vw, 220px);
  height: calc(var(--rest) + var(--pull) * var(--travel));
  position: relative; overflow: hidden; overflow-anchor: none;
  transition: height .38s cubic-bezier(.2,.83,.32,1);
  isolation: isolate;
}
.hero-art {
  position: absolute; width: 100%; height: 100%; inset: 0;
  object-fit: cover; object-position: 50% calc(24% + var(--pull) * 13%);
  mask-image: linear-gradient(#000 0%, #000 60%, #000d 78%, transparent 100%);
}
.hero::after {
  position: absolute; content: ""; inset: 0; pointer-events: none;
  background: linear-gradient(#21192199, transparent 70px);
}
.top {
  position: relative; z-index: 1; width: min(100% - 64px, 1680px); margin: auto;
  min-height: 45px; display: flex; align-items: center; justify-content: space-between;
  color: #fff2f5; font-size: 11px;
}
.clip-mark { display: flex; gap: 4px; transform: rotate(-11deg); }
.clip-mark i { width: 11px; height: 11px; border-radius: 1px; background: var(--blue); box-shadow: 1px 2px #20182266; }
.clip-mark i:last-child { background: var(--yellow); transform: translateY(5px); }
.shell { width: min(100% - 64px, 1680px); margin: -9px auto 0; position: relative; }
.controls {
  display: flex; justify-content: space-between; align-items: center; gap: 14px;
  padding: 0 3px; border-bottom: 1px solid var(--line); margin-bottom: 14px;
}
.tabs { display: flex; gap: 18px; }
.tabs button, .calendar-panel button, .record-panel button, .utility button, .pager button {
  border: 0; background: none;
}
.tabs button { padding: 13px 0 11px; border-bottom: 2px solid transparent; color: var(--muted); white-space: nowrap; }
.tabs button.on { border-color: var(--pink); color: var(--ink); }
.searchbox { width: min(270px, 40%); position: relative; }
.searchbox span { position: absolute; inset: 5px auto auto 8px; color: var(--muted); }
.searchbox input { width: 100%; border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px 5px 25px; background: #fff9; font-size: 12px; }
.catalog-layout { display: grid; grid-template-columns: minmax(0,1fr) 234px; gap: 18px; align-items: start; }
.catalog-main, .calendar-panel, .record-panel { background: #fff9faee; border: 1px solid #fff9; border-radius: 8px; }
.catalog-main { min-width: 0; padding: 14px 17px; border-radius: 2px; }
.section-heading { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
.section-heading h2, .calendar-heading h3, .record-heading h3 { margin: 0; font-weight: 600; }
.section-heading h2 { font-size: 17px; }
.section-heading p { margin: 2px 0 0; }
.section-heading p, .page-label, .notice { color: var(--muted); font-size: 12px; }
.notice:empty { display: none; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 18px 12px; }
.card { min-width: 0; }
.cover { display: block; overflow: hidden; border-radius: 4px; aspect-ratio: 16 / 10; position: relative; background: #e7d9df; }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.duration, .corner { position: absolute; font-size: 10px; background: #262027d9; color: #fff; border-radius: 2px; padding: 1px 5px; }
.duration { bottom: 5px; right: 5px; font-variant-numeric: tabular-nums; }
.corner { left: 5px; top: 5px; }
.card-title { font-size: 14px; font-weight: 400; line-height: 1.48; margin: 7px 0 4px; min-height: 2.96em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-title:hover, .card-actions button:hover, .utility a:hover { color: var(--pink); }
.card-meta, .card-actions { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; color: var(--muted); font-size: 11px; }
.card-meta .owner { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-meta > :last-child, .card-actions button { flex-shrink: 0; }
.card-actions { margin-top: 3px; font-size: 10px; }
.card-actions button { border: 0; background: none; padding: 2px 0 2px 5px; }
.empty { grid-column: 1 / -1; padding: 28px 0; color: var(--muted); }
.pager { display: flex; justify-content: center; align-items: center; margin-top: 18px; gap: 3px; }
.pager button, .pager span { min-width: 36px; min-height: 34px; display: grid; place-items: center; }
.pager button { border-radius: 50%; background: #f1e2e9; font-size: 17px; }
.pager button:not(:disabled):hover { background: #e9cbd9; }
.pager button:disabled { color: #a08a97; background: transparent; }
.pager span { padding: 0 13px; font-variant-numeric: tabular-nums; color: var(--muted); }
.catalog-aside { display: grid; gap: 13px; min-width: 0; }
.calendar-panel { padding: 13px 12px 0; position: relative; }
.calendar-heading, .record-heading, .calendar-month, .calendar-selected, .music-times, .music-bottom, .local-audio { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.calendar-heading { margin-bottom: 9px; }
.calendar-heading h3, .record-heading h3 { font-size: 13px; }
.ticket-mark { display: inline-flex; align-items: center; gap: 2px; }
.ticket-mark i { width: 4px; height: 12px; border-radius: 1px; transform: rotate(12deg); background: var(--blue); }
.ticket-mark i:nth-child(2) { background: var(--yellow); }
.ticket-mark i:nth-child(3) { background: #d998b7; }
.ticket-mark i:nth-child(4) { background: var(--red); }
.calendar-month strong { font-weight: 600; font-variant-numeric: tabular-nums; }
.calendar-month button { min-width: 28px; min-height: 27px; font-size: 19px; color: var(--muted); }
.calendar-month button:disabled { opacity: .32; }
.calendar-week, .calendar-days { display: grid; grid-template-columns: repeat(7,minmax(0,1fr)); text-align: center; gap: 1px; }
.calendar-week { color: var(--muted); font-size: 10px; margin: 5px 0 2px; }
.calendar-days button, .calendar-blank { min-height: 25px; font-size: 11px; position: relative; z-index: 0; font-variant-numeric: tabular-nums; }
.calendar-days button:disabled { color: #a28d98; }
.calendar-days button:not(:disabled)::after { content: ""; position: absolute; background: var(--red); border-radius: 50%; width: 3px; height: 3px; bottom: 1px; left: calc(50% - 1px); }
.calendar-days button.chosen { color: white; }
.calendar-days button.chosen::before { content: ""; position: absolute; z-index: -1; inset: 1px 2px 0; background: var(--pink); clip-path: polygon(19% 0,81% 0,100% 32%,81% 70%,50% 100%,19% 70%,0 32%); }
.calendar-days button.chosen::after { display: none; }
.calendar-days .band-date { box-shadow: inset 0 -2px var(--band); }
.band-date.hitori { --band: #d998b7; }
.band-date.kita { --band: var(--red); }
.band-date.nijika { --band: var(--yellow); }
.band-date.ryo { --band: var(--blue); }
.calendar-occasion { color: var(--muted); font-size: 10px; margin: 5px 0 0; }
.calendar-occasion a:hover { color: var(--pink); }
.calendar-selected { margin: 9px -12px 0; padding: 9px 11px; background: #f1e2e8; border-top: 1px dashed #c6a5b8; border-radius: 0 0 7px 7px; color: var(--muted); font-size: 11px; }
.calendar-selected::before, .calendar-selected::after { content: ""; position: absolute; bottom: 28px; width: 8px; height: 8px; background: var(--paper); border-radius: 50%; }
.calendar-selected::before { left: -4px; }
.calendar-selected::after { right: -4px; }
.calendar-selected button { color: #743752; padding: 0; }
.record-panel { padding: 12px; }
.record-heading { margin-bottom: 10px; }
.record-heading span, .record-panel label, .music-bottom, .local-audio, .music-message { font-size: 10px; color: var(--muted); }
.turntable { height: 155px; overflow: hidden; position: relative; background: linear-gradient(140deg,#5f4b56,#2a232d 72%); border-radius: 5px; box-shadow: inset 0 0 0 1px #7d6872, inset 0 -4px #221b24; }
.turntable-plate { position: absolute; left: 9px; top: 9px; width: 132px; aspect-ratio: 1; border: 4px solid #a197a0; border-radius: 50%; box-shadow: 0 3px 9px #0f0d14b3; }
.vinyl { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; background: repeating-radial-gradient(circle,#16141c 0 1px,#35313c 2px,#1b1920 3px); animation: vinyl 1.8s linear infinite paused; }
.record-label { position: relative; width: 42%; aspect-ratio: 1; display: grid; place-items: center; overflow: hidden; border-radius: 50%; background: #dbadc4; color: #3e2a3b; font-size: 10px; }
.record-label img { position: absolute; width: 100%; height: 100%; object-fit: cover; }
.record-label::after { content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 5px; height: 5px; border-radius: 50%; background: #16141a; border: 1px solid #bdaab5; }
.tonearm { position: absolute; right: 15px; top: 14px; width: 15px; height: 106px; transform-origin: 7px 7px; transition: transform .55s ease; }
.tonearm::before { content: ""; position: absolute; width: 15px; height: 15px; border-radius: 50%; background: radial-gradient(circle,#565059 15%,#b8afb7 22%,#7b727c 64%,#29242c 68%); z-index: 1; }
.tonearm::after { content: ""; position: absolute; top: 9px; left: 5px; height: 85px; width: 5px; border-radius: 3px; background: linear-gradient(90deg,#78727c,#dbd3dc,#7b747e); transform-origin: top; transform: rotate(13deg); }
.tonearm i { position: absolute; left: -10px; top: 89px; width: 11px; height: 17px; border: 2px solid #39303a; background: #c8b6c3; transform: rotate(13deg); z-index: 1; }
.power-led { position: absolute; left: 12px; bottom: 7px; width: 4px; height: 4px; border-radius: 50%; background: #786873; }
.deck-type { position: absolute; bottom: 8px; right: 10px; font-size: 7px; color: #d7c2d0; letter-spacing: 1px; }
.deck-strobe { position: absolute; left: 18px; bottom: 6px; width: 36px; height: 3px; background: repeating-linear-gradient(90deg,#a58d9e 0 1px,transparent 1px 4px); }
.playing .vinyl { animation-play-state: running; }
.playing .tonearm { transform: rotate(var(--arm-angle,26deg)); }
.playing .power-led { background: #f5a1ca; box-shadow: 0 0 5px #fa8ec0; }
@keyframes vinyl { to { transform: rotate(360deg); } }
.music-sleeve { display: flex; align-items: center; gap: 8px; margin-top: 10px; min-width: 0; }
.music-sleeve img { width: 43px; height: 43px; object-fit: cover; border-radius: 2px; background: #ead6e2; }
.music-sleeve div { min-width: 0; }
.music-sleeve strong, .music-sleeve small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.music-sleeve strong { font-size: 11px; font-weight: 600; }
.music-sleeve small { font-size: 10px; color: var(--muted); }
.record-panel select { margin-top: 7px; width: 100%; padding: 4px 0; border: 0; border-bottom: 1px solid var(--line); background: transparent; font-size: 11px; }
.music-transport { display: flex; justify-content: center; align-items: center; gap: 12px; margin: 5px 0; }
.music-transport button { width: 30px; height: 30px; font-size: 16px; color: #75455f; }
.music-transport #music-play { border-radius: 50%; background: #f1e2e9; font-size: 13px; }
.record-panel input[type=range] { display: block; width: 100%; height: 4px; accent-color: var(--pink); margin: 6px 0; }
.music-times { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.music-bottom, .local-audio { margin-top: 6px; }
.music-bottom label { display: flex; gap: 5px; align-items: center; white-space: nowrap; }
.music-bottom #music-volume { width: 42px; }
.local-audio label, .local-audio button, .music-bottom a, .music-bottom button { cursor: pointer; color: #783c5a; padding: 0; }
.music-message { margin: 4px 0 0; }
.music-message:empty { display: none; }
.footer { padding: 12px 1px 35px; color: var(--muted); font-size: 11px; }
.footer details { margin-bottom: 7px; }
.footer summary { cursor: pointer; }
.utility { display: flex; flex-wrap: wrap; gap: 7px 13px; }
.utility button, .filelabel { padding: 0; cursor: pointer; }
.jump-end { position: fixed; z-index: 3; right: 17px; bottom: 16px; width: 35px; height: 35px; border: 1px solid #ceafc0; border-radius: 50%; background: #fff6fa; color: #713957; display: grid; place-items: center; box-shadow: 0 3px 9px #44253b18; }
.jump-end svg { width: 16px; height: 16px; }
dialog { width: min(480px,92vw); border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); }
dialog::backdrop { background: #251b27a8; }
.full-player { width: min(650px, 94vw); padding: 11px 13px; background: #27202a; color: #f7e9f2; }
.full-player header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.full-player h3 { font-weight: 500; }
.full-player button { color: inherit; border: 0; background: none; font-size: 22px; }
.full-player iframe { border: 0; width: 100%; aspect-ratio: 16 / 9; min-height: 200px; display: block; background: #17131b; }
.full-player a { display: inline-block; margin-top: 8px; color: #e9b8d4; font-size: 12px; }
dialog h3, dialog p { margin: 0 0 9px; }
dialog label { display: block; margin-top: 6px; }
dialog select, dialog textarea { width: 100%; border: 1px solid var(--line); background: #fff; padding: 6px; }
dialog textarea { min-height: 74px; resize: vertical; }
.form-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.dialog-actions { display: flex; gap: 6px; margin-top: 9px; }
.dialog-actions button { border: 1px solid var(--line); border-radius: 4px; background: #f6e8ef; padding: 5px 7px; }
@media (min-width: 1160px) { .grid { grid-template-columns: repeat(4, minmax(0,1fr)); } }
@media (min-width: 1440px) { .grid { grid-template-columns: repeat(5, minmax(0,1fr)); } }
@media (max-width: 950px) {
  .top, .shell { width: calc(100% - 32px); }
  .grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
}
@media (max-width: 670px) {
  .hero { --rest: 180px; --travel: 115px; }
  .hero-art { object-position: 70% 38%; }
  .top, .shell { width: calc(100% - 22px); }
  .controls { padding: 0 8px; gap: 8px; }
  .tabs { gap: 9px; font-size: 11px; }
  .searchbox { width: 46%; }
  .catalog-layout { grid-template-columns: minmax(0,1fr); gap: 12px; }
  .catalog-main { padding: 12px 9px; }
  .catalog-aside { grid-template-columns: 1fr 1fr; gap: 8px; align-items: start; }
  .record-panel, .calendar-panel { min-width: 0; }
  .turntable { height: 118px; }
  .turntable-plate { width: 98px; }
  .tonearm { transform: scale(.75); right: 7px; top: 9px; }
  .playing .tonearm { transform: scale(.75) rotate(var(--arm-angle,26deg)); }
  .deck-type { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .hero, .tonearm { transition: none; }
  .vinyl { animation: none; }
}
</style>
</head>
<body>
  <header class="hero" id="interactive-hero">
    <img class="hero-art" src="assets/bocchi-livehouse-v1.webp" alt="结束乐队在排练室" width="2172" height="724" fetchpriority="high" decoding="async">
    <div class="top">
      <span class="clip-mark" aria-hidden="true"><i></i><i></i></span>
      <time id="updated"></time>
    </div>
  </header>
  <div class="shell">
    <main id="discover">
      <div class="controls">
        <nav class="tabs" aria-label="视频分区">
          <button data-tab="daily" class="on">本期</button>
          <button data-tab="archive">全部入选</button>
          <button data-tab="saved">我的认可</button>
        </nav>
        <div class="searchbox">
          <span aria-hidden="true">⌕</span>
          <input id="search" aria-label="搜索入选作品" placeholder="标题 / UP / BV号" maxlength="120" autocomplete="off">
        </div>
      </div>
      <div class="catalog-layout">
        <section class="catalog-main">
          <div class="section-heading">
            <div><h2 id="section-title">本期入选</h2><p id="section-sub"></p></div>
            <span class="page-label" id="count"></span>
          </div>
          <div class="notice" id="message" role="status" aria-live="polite"></div>
          <div class="grid" id="grid"></div>
          <nav class="pager" aria-label="目录翻页">
            <button id="prev" aria-label="上一页" title="上一页" disabled>‹</button>
            <span id="page-label" aria-live="polite">1 / 1</span>
            <button id="next" aria-label="下一页" title="下一页">›</button>
          </nav>
        </section>
        <aside class="catalog-aside">
          <section class="calendar-panel">
            <div class="calendar-heading">
              <h3>放映日历</h3>
              <span class="ticket-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            </div>
            <div class="calendar-month">
              <button id="calendar-prev" aria-label="上个月">‹</button>
              <strong id="calendar-month"></strong>
              <button id="calendar-next" aria-label="下个月">›</button>
            </div>
            <div class="calendar-week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
            <div class="calendar-days" id="calendar-days"></div>
            <p class="calendar-occasion" id="calendar-occasion" hidden></p>
            <div class="calendar-selected">
              <span id="calendar-selected-date"></span>
              <span id="calendar-selected-count"></span>
              <button id="calendar-today" title="回到最近上架日">最近</button>
            </div>
          </section>
          <section class="record-panel">
            <div class="record-heading"><h3>結束バンド</h3><span id="music-kind"></span></div>
            <div class="turntable" id="turntable">
              <div class="turntable-plate"><div class="vinyl"><div class="record-label"><span>33⅓</span><img id="record-art" alt="" hidden></div></div></div>
              <div class="tonearm"><i></i></div><div class="power-led"></div>
              <div class="deck-strobe" aria-hidden="true"></div><span class="deck-type">33⅓ · STEREO</span>
            </div>
            <div class="music-sleeve">
              <img id="sleeve-art" alt="" width="43" height="43" hidden>
              <div><strong id="music-title"></strong><small id="music-album"></small></div>
            </div>
            <select id="music-track" aria-label="选择曲目"></select>
            <div class="music-transport">
              <button id="music-prev" aria-label="上一首">‹</button>
              <button id="music-play" aria-label="播放">▶</button>
              <button id="music-next" aria-label="下一首">›</button>
            </div>
            <input id="music-seek" type="range" min="0" max="1000" value="0" aria-label="播放进度">
            <div class="music-times"><span id="music-elapsed">0:00</span><span id="music-duration">—</span></div>
            <div class="music-bottom">
              <label>音量<input id="music-volume" type="range" min="0" max="1" step="0.01" value="0.25" aria-label="音量"></label>
              <button id="music-preview" hidden>试听</button>
              <a id="music-download" target="_blank" rel="noopener" hidden>购买下载 ↗</a>
            </div>
            <div class="local-audio">
              <label>打开本地音频<input type="file" id="music-local" accept="audio/*,.flac,.m4a,.mp3" multiple hidden></label>
              <button id="music-official" hidden>返回试听</button>
            </div>
            <p class="music-message" id="music-message" role="status"></p>
            <audio id="music-audio" preload="none"></audio>
          </section>
        </aside>
      </div>
    </main>
    <footer class="footer" id="page-end">
      <details>
        <summary>关于收录与更新</summary>
        <p id="collection-note"></p>
        <p>作品经复核后上架，日历记录上架日。每天北京时间 12:00 更新采集数据，依赖本机开机联网。标注保存在当前浏览器。</p>
        <p>页头为同人插画，唱片封面来自发行方曲库。</p>
      </details>
      <div class="utility">
        <button id="export">导出标注</button>
        <label class="filelabel">导入标注<input id="import" type="file" accept=".json" hidden></label>
        <button id="undo">撤销上次</button>
        <a href="web/ecosystem-report.html">原调查报告</a>
      </div>
    </footer>
  </div>
  <button class="jump-end" id="jump-end" aria-label="跳到页尾" title="跳到页尾">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M10 3v10m-4-4 4 4 4-4M5 16h10"/></svg>
  </button>
  <dialog class="full-player" id="full-player" aria-labelledby="full-track-title">
    <header><h3 id="full-track-title"></h3><button id="close-full-player" type="button" aria-label="关闭播放器">×</button></header>
    <div id="full-player-frame"></div>

window.BiliDiscovery={receive(key,rows){const r=pending.get(key);if(r){cache.set(key,rows);if(cache.size>12)cache.delete(cache.keys().next().value);pending.delete(key);r.resolve(rows);}}};
function chunk(file){if(cache.has(file))return Promise.resolve(cache.get(file));if(pending.has(file))return pending.get(file).promise;let resolve,reject;const promise=new Promise((a,b)=>{resolve=a;reject=b;});pending.set(file,{promise,resolve,reject});const script=document.createElement('script');script.src=file;script.dataset.key=file;script.async=true;script.onerror=()=>{pending.delete(file);script.remove();reject(Error('分页面加载失败，请刷新重试'));};script.onload=()=>script.remove();document.head.appendChild(script);return promise;}
const fmt = n => {
  if (n >= 1e8) return (n / 1e8).toFixed(2) + '亿';
  if (n >= 1e4) return (n / 1e4).toFixed(n >= 1e6 ? 0 : 1) + '万';
  return String(n || 0);
};
const date=d=>d?d.slice(0,4)+'.'+d.slice(4,6)+'.'+d.slice(6,8):'日期待补';
function card(record) {
  const {bvid, dur, title, owner, view, admitted_on: admitted, first_seen: seen} = record;
  const saved = status(reviews[bvid]) === 'confirmed';
  const pic = /^(https?:\/\/|assets\/(?:selected-)?covers\/BV[0-9A-Za-z]{10}\.webp$)/.test(record.pic || '')
    ? record.pic.replace(/^http:/, 'https:') : '';
  const time = Math.floor((dur || 0) / 60) + ':' + String((dur || 0) % 60).padStart(2, '0');
  const url = 'https://www.bilibili.com/video/' + bvid;
  const cardDate = admitted ? (tab === 'daily' && !query ? '' : date(admitted)) : '发现于 ' + date(seen);
  return `<article class="card">
    <a class="cover" href="${url}" target="_blank" rel="noopener noreferrer" aria-label="${esc(title)}">
      ${pic ? `<img src="${esc(pic)}" loading="lazy" decoding="async" referrerpolicy="no-referrer" width="480" height="300" alt="">` : ''}
      ${saved ? '<span class="corner">已认可</span>' : ''}<span class="duration">${time}</span>
    </a>
    <a class="card-title" href="${url}" target="_blank" rel="noopener noreferrer">${esc(title)}</a>
    <div class="card-meta"><span class="owner">${esc(owner || '作者见原视频')}</span><span>${fmt(view)} 播放</span></div>
    <div class="card-actions"><span>${cardDate}</span><button data-review="${bvid}">${saved ? '修改标注' : admitted ? '收录笔记' : '记下感受'}</button></div>
  </article>`;
}

function show(rows, n) {
  currentRows = rows;
  total = n;
  $('grid').innerHTML = rows.map(card).join('') || '<div class="empty">暂无作品。</div>';
  $('count').textContent = n.toLocaleString() + (BOOT.curated ? ' 部' : ' 条');
  $('page-label').textContent = (page + 1) + ' / ' + Math.max(1, Math.ceil(n / 24));
  $('prev').disabled = page === 0;
  $('next').disabled = (page + 1) * 24 >= n;
  const titles = {
    daily: BOOT.curated ? '本期入选' : '当期目录',
    archive: BOOT.curated ? '全部入选' : '全部探索',
    saved: '我的认可'
  };
  $('section-title').textContent = query ? '搜索结果' : titles[tab];
  $('section-sub').textContent = query ? '「' + query + '」' : tab === 'daily' && activeDay ? date(activeDay) : '';
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
}
let searchResolvers=new Map();
function workerSearch(args){if(location.protocol==='file:')return Promise.reject(Error('全库搜索请使用网页地址，或运行 run_review.ps1。'));if(!worker){worker=new Worker(BOOT.worker);worker.onmessage=({data})=>{const p=searchResolvers.get(data.id);if(!p)return;searchResolvers.delete(data.id);data.error?p.reject(Error(data.error)):p.resolve(data);};worker.onerror=()=>{for(const p of searchResolvers.values())p.reject(Error('搜索加载失败，请刷新重试'));searchResolvers.clear();worker.terminate();worker=null;};}const id=++workerSearch.id;return new Promise((resolve,reject)=>{searchResolvers.set(id,{resolve,reject});worker.postMessage({...args,id});});}workerSearch.id=0;
async function render(){const my=++token;$('message').textContent='';try{if(query||tab==='saved'){const ids=tab==='saved'&&!query?Object.keys(reviews).filter(b=>status(reviews[b])==='confirmed'):null;if(ids?.length===0){show([],0);return;}$('message').textContent='正在后台查找，不影响页面浏览…';const result=await workerSearch({query,ids,offset:page*24});if(my!==token)return;$('message').textContent='';show(result.rows.map(unpack),result.total);return;}const stream=BOOT.streams[tab==='daily'&&activeDay!==BOOT.latest_day?'day:'+activeDay:tab];if(!stream||stream.count===0){show([],0);return;}const absolute=page*24,index=Math.floor(absolute/BOOT.chunkSize),offset=absolute%BOOT.chunkSize;const values=await chunk(stream.chunks[index]);if(my!==token)return;show(values.slice(offset,offset+24).map(unpack),stream.count);}catch(e){if(my===token)$('message').textContent=e.message;}}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(documentForExport()));}catch(e){$('message').textContent='浏览器保存失败，请导出标注备份。';}}
function documentForExport(){return {schema:SCHEMA,profile_id:PROFILE,catalog_id:BOOT.catalog_id,experiment_id:BOOT.experiment_id,reviews};}
function remember(){history.push(JSON.stringify(reviews));if(history.length>30)history.shift();}
function openReview(b){selected=currentRows.find(r=>r.bvid===b);if(!selected)return;const r=reviews[b]||{};$('review-title').textContent=selected.title;$('review-note').textContent=selected.review_note?(selected.review_basis+' · '+selected.review_note):'制作与共鸣各至少2分，并认可表达本身，才加入“我的认可”。';for(const k of ['craft','resonance','reason','evidence'])$(k).value=r[k]??'';$('watched').checked=r.watched===true;$('review-dialog').showModal();}
$('grid').addEventListener('click',e=>{const b=e.target.closest('[data-review]');if(b)openReview(b.dataset.review);});
$('review-form').addEventListener('submit',e=>{e.preventDefault();if(!$('review-form').reportValidity())return;remember();reviews[selected.bvid]={craft:Number($('craft').value),resonance:Number($('resonance').value),reason:$('reason').value,evidence:$('evidence').value,watched:$('watched').checked};persist();$('review-dialog').close();show(currentRows,total);});
$('close-review').addEventListener('click',()=>$('review-dialog').close());$('clear-review').addEventListener('click',()=>{remember();delete reviews[selected.bvid];persist();$('review-dialog').close();if(tab==='saved')render();else show(currentRows,total);});
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;if(tab==='daily'&&BOOT.latest_day){activeDay=BOOT.latest_day;calendarMonth=activeDay.slice(0,6);paintCalendar();}page=0;query='';$('search').value='';clearTimeout(searchTimer);render();}));
$('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{query=$('search').value.trim();page=0;render();},250);});
function changePage(step) {
  const next = page + step;
  if (next < 0 || next * 24 >= total) return;
  page = next;
  render().then(() => window.scrollTo(0, 0));
}
$('prev').addEventListener('click', () => changePage(-1));
$('next').addEventListener('click', () => changePage(1));
$('export').addEventListener('click',()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(documentForExport(),null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='制作与共鸣标注.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
$('import').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const clean=validate(JSON.parse(await file.text()));remember();Object.assign(reviews,clean);persist();await render();$('message').textContent='已导入 '+Object.keys(clean).length+' 条标注。';}catch(error){$('message').textContent='导入失败：'+error.message;}e.target.value='';});
$('undo').addEventListener('click',()=>{if(!history.length){$('message').textContent='暂无可撤销的判断。';return;}reviews=Object.assign(Object.create(null),JSON.parse(history.pop()));persist();render();});
$('updated').textContent = '更新 ' + BOOT.generated_at.slice(0, 16);
$('collection-note').textContent = BOOT.collection
  ? '最近采集完成于 ' + date(BOOT.collection.finished_at.slice(0, 8)) + '，新发现热门 ' + BOOT.collection.new_videos + ' 条。'
  : '本期使用已有采集数据。';
if (!BOOT.curated) {
  $('search').setAttribute?.('aria-label', '搜索样本目录');
}
show(BOOT.initial.map(unpack),BOOT.streams.daily.count);


// Calendar, a scroll-responsive cover, and the turntable.
const calendarDates=Object.keys(BOOT.calendar||{}).sort();
const bandDates = {
  '0221': ['后藤一里生日', 'hitori', 'https://bocchi.rocks/birthday/hitori.html'],
  '0421': ['喜多郁代生日', 'kita', 'https://bocchi.rocks/kessokuband/info/?article_id=60509'],
  '0529': ['伊地知虹夏生日', 'nijika', 'https://bocchi.rocks/kessokuband/info/?article_id=60699'],
  '0918': ['山田凉生日', 'ryo', 'https://bocchi.rocks/kessokuband/info/?article_id=61533'],
  '1225': ['首张专辑数字发行纪念日', 'hitori', 'https://mora.jp/package/43000100/SVWC70613B00Z_48/']
};
let calendarMonth=(activeDay||BOOT.generated_at.slice(0,7).replace('-','')).slice(0,6);
const calendarUnit = BOOT.curated ? '部入选' : '条候选';
function paintCalendar(){
 const year=Number(calendarMonth.slice(0,4)),month=Number(calendarMonth.slice(4,6)),offset=(new Date(year,month-1,1).getDay()+6)%7,days=new Date(year,month,0).getDate();
 $('calendar-month').textContent=year+' / '+String(month).padStart(2,'0');
 let html=Array.from({length:offset},()=>'<span class="calendar-blank"></span>').join('');
 for (let day = 1; day <= days; day++) {
   const key = calendarMonth + String(day).padStart(2, '0');
   const count = (BOOT.calendar || {})[key] || 0;
   const occasion = bandDates[key.slice(4)];
   const label = count + calendarUnit + (occasion ? ' · ' + occasion[0] : '');
   const classes = [key === activeDay ? 'chosen' : '', occasion ? 'band-date ' + occasion[1] : ''].join(' ');
   html += `<button data-day="${key}" ${count ? '' : 'disabled'} class="${classes}" aria-pressed="${key === activeDay}" aria-label="${year}年${month}月${day}日，${label}" title="${label}">${day}</button>`;
 }
 $('calendar-days').innerHTML=html;$('calendar-selected-date').textContent=activeDay?date(activeDay):'暂无上架';$('calendar-selected-count').textContent=((BOOT.calendar||{})[activeDay]||0)+' '+calendarUnit;
 const monthEvent = Object.entries(bandDates).find(([day]) => day.slice(0, 2) === calendarMonth.slice(4));
 $('calendar-occasion').hidden = !monthEvent;
 $('calendar-occasion').innerHTML = monthEvent
   ? `<a href="${monthEvent[1][2]}" target="_blank" rel="noopener">${Number(monthEvent[0].slice(2))} 日 · ${monthEvent[1][0]}</a>` : '';
 const buildYear = Number(BOOT.generated_at.slice(0, 4));
 const firstYear = calendarDates.length ? Number(calendarDates[0].slice(0, 4)) : buildYear;
 $('calendar-prev').disabled = calendarMonth <= Math.min(buildYear - 1, firstYear) + '01';
 $('calendar-next').disabled = calendarMonth >= (buildYear + 1) + '12';
}
function moveMonth(step){const y=Number(calendarMonth.slice(0,4)),m=Number(calendarMonth.slice(4,6)),d=new Date(y,m-1+step,1);calendarMonth=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0');paintCalendar();}
$('calendar-prev').addEventListener('click',()=>moveMonth(-1));$('calendar-next').addEventListener('click',()=>moveMonth(1));
$('calendar-days').addEventListener('click',e=>{const b=e.target.closest('[data-day]');if(!b||b.disabled)return;activeDay=b.dataset.day;tab='daily';page=0;query='';$('search').value='';clearTimeout(searchTimer);paintCalendar();render();});
$('calendar-today').addEventListener('click',()=>{if(!BOOT.latest_day)return;activeDay=BOOT.latest_day;calendarMonth=activeDay.slice(0,6);tab='daily';page=0;query='';$('search').value='';clearTimeout(searchTimer);paintCalendar();render();});
paintCalendar();

const hero = $('interactive-hero');
const expandThreshold = 44;
let wheelPull = 0;
function resetHero() {
  if (!wheelPull) return;
  wheelPull = 0;
  hero.style.setProperty('--pull', '0');
}
window.addEventListener('wheel', event => {
  if (event.ctrlKey || event.shiftKey || Math.abs(event.deltaX) > Math.abs(event.deltaY)) return;
  if (event.deltaY > 0) {
    resetHero();
    return;
  }
  if (event.deltaY >= 0 || window.scrollY > 1 || wheelPull >= expandThreshold) return;
  const units = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? window.innerHeight : 1;
  wheelPull = Math.min(expandThreshold, wheelPull - event.deltaY * units);
  const stretch = wheelPull === expandThreshold ? 1 : .48 * wheelPull / expandThreshold;
  hero.style.setProperty('--pull', String(stretch));
}, {passive: true});
window.addEventListener('scroll', () => {
  if (window.scrollY > 1) resetHero();
}, {passive: true});
$('jump-end').addEventListener('click', () => {
  resetHero();
  window.scrollTo(0, document.documentElement.scrollHeight);
});

const audio=$('music-audio'),officialTracks=BOOT.music||[];let musicTracks=[...officialTracks],trackIndex=0,localUrls=[],fallbackTried=false;
const musicTime=n=>Number.isFinite(n)?Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0'):'—';
function musicList() {
  $('music-track').innerHTML = musicTracks.map((track, index) =>
    `<option value="${index}">${esc(track.title)}</option>`).join('');
  $('music-track').value = String(trackIndex);
}

function paintTrack(track) {
  if (!track) return;
  $('music-title').textContent = track.title;
  $('music-album').textContent = track.album ? track.album + ' · ' + track.number : '本地音频';
  $('music-kind').textContent = track.fullVideo ? '完整曲目' : track.kind || '本地音频';
  $('music-play').textContent = '▶';
  $('music-play').setAttribute('aria-label', track.fullVideo ? '播放完整曲目' : '播放');
  $('music-play').title = track.fullVideo ? '播放完整曲目' : '播放';
  $('music-preview').hidden = !track.fullVideo;
  $('music-preview').textContent = '试听';
  $('music-official').hidden = Boolean(track.url);
  for (const id of ['record-art', 'sleeve-art']) {
    const art = $(id);
    art.hidden = !track.art;
    if (track.art) art.src = track.art;
  }
  $('music-download').hidden = !track.download;
  if (track.download) $('music-download').href = track.download;
}

function loadTrack(index, play = false) {
  if (!musicTracks.length) {
    $('music-message').textContent = '可以选择本地音频播放。';
    return;
  }
  audio.pause();
  fallbackTried = false;
  trackIndex = (index + musicTracks.length) % musicTracks.length;
  const track = musicTracks[trackIndex];
  audio.src = track.src;
  $('music-track').value = String(trackIndex);
  paintTrack(track);
  $('music-message').textContent = '';
  $('music-seek').value = '0';
  $('music-elapsed').textContent = '0:00';
  $('music-duration').textContent = '—';
  $('turntable').style.setProperty('--arm-angle', '26deg');
  if (play) startMusic();
}
function startMusic(){audio.play().catch(()=>{$('music-message').textContent='试听暂时无法连接，可选择本地音频或打开完整曲目。';});}
function paintTransport(playing) {
  if (musicTracks[trackIndex]?.fullVideo) {
    $('music-preview').textContent = playing ? '暂停试听' : '试听';
    return;
  }
  $('music-play').textContent = playing ? 'Ⅱ' : '▶';
  $('music-play').setAttribute('aria-label', playing ? '暂停' : '播放');
}
function transportState(playing) {
  $('turntable').classList.toggle('playing', playing);
  paintTransport(playing);
}
audio.addEventListener('play',()=>{paintTransport(true);$('music-message').textContent='正在连接音源…';});
audio.addEventListener('playing',()=>{transportState(true);$('music-message').textContent='';});
audio.addEventListener('waiting',()=>{$('turntable').classList.remove('playing');$('music-message').textContent='正在缓冲…';});
audio.addEventListener('pause',()=>transportState(false));audio.addEventListener('error',()=>{transportState(false);const backup=musicTracks[trackIndex]?.fallbackSrc;if(backup&&!fallbackTried){fallbackTried=true;audio.src=backup;startMusic();return;}$('music-message').textContent='音频加载失败，可切换曲目或选择本地音频。';});
audio.addEventListener('loadedmetadata',()=>{$('music-duration').textContent=musicTime(audio.duration);});
audio.addEventListener('timeupdate', () => {
  const fraction = audio.duration > 0 ? Math.min(1, audio.currentTime / audio.duration) : 0;
  $('music-elapsed').textContent = musicTime(audio.currentTime);
  $('music-seek').value = String(fraction * 1000);
  $('turntable').style.setProperty('--arm-angle', (26 + fraction * 10) + 'deg');
});
audio.addEventListener('ended',()=>loadTrack(trackIndex+1,true));audio.volume=.25;
function toggleAudio() {
  if (!audio.src) loadTrack(trackIndex, false);
  if (audio.paused) startMusic();
  else audio.pause();
}

const fullPlayer = $('full-player');
function openFullTrack(track) {
  audio.pause();
  const frame = document.createElement('iframe');
  frame.title = track.title + ' · 完整曲目';
  frame.referrerPolicy = 'strict-origin-when-cross-origin';
  frame.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
  frame.src = 'https://www.youtube-nocookie.com/embed/' + track.fullVideo + '?autoplay=1&playsinline=1';
  $('full-track-title').textContent = track.title;
  $('full-track-link').href = 'https://www.youtube.com/watch?v=' + track.fullVideo;
  $('full-player-frame').replaceChildren(frame);
  fullPlayer.showModal();
}
$('close-full-player').addEventListener('click', () => fullPlayer.close());
fullPlayer.addEventListener('close', () => $('full-player-frame').replaceChildren());
$('music-play').addEventListener('click', () => {
  const track = musicTracks[trackIndex];
  if (track?.fullVideo) openFullTrack(track);
  else toggleAudio();
});
$('music-preview').addEventListener('click', toggleAudio);
$('music-prev').addEventListener('click',()=>loadTrack(trackIndex-1,!audio.paused));$('music-next').addEventListener('click',()=>loadTrack(trackIndex+1,!audio.paused));
$('music-track').addEventListener('change',()=>loadTrack(Number($('music-track').value),!audio.paused));
$('music-seek').addEventListener('input',()=>{if(Number.isFinite(audio.duration)&&audio.duration>0)audio.currentTime=Number($('music-seek').value)/1000*audio.duration;});
$('music-volume').addEventListener('input',()=>{audio.volume=Number($('music-volume').value);});
$('music-local').addEventListener('change',e=>{const files=Array.from(e.target.files||[]);if(!files.length)return;audio.pause();for(const url of localUrls)URL.revokeObjectURL(url);localUrls=[];musicTracks=files.map(file=>{const src=URL.createObjectURL(file);localUrls.push(src);return {title:file.name.replace(/\.[^.]+$/,''),src,kind:'本地音频'};});trackIndex=0;musicList();loadTrack(0,false);});
$('music-official').addEventListener('click',()=>{audio.pause();musicTracks=[...officialTracks];trackIndex=0;musicList();loadTrack(0,false);for(const url of localUrls)URL.revokeObjectURL(url);localUrls=[];});
musicList();
paintTrack(officialTracks[0]);
</script>
