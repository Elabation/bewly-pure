<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4ebed">
  <title>每日视频目录</title>
  <style>__STYLE__</style>
</head>
<body>
  <header class="hero" id="interactive-hero">
    <img class="hero-art" src="assets/bocchi-livehouse-v1.webp" alt="结束乐队在排练室" width="2172" height="724" fetchpriority="high" decoding="async">
    <div class="top">
      <span class="clip-mark" aria-hidden="true"><i></i><i></i></span>
      <time id="updated"></time>
    </div>
  </header>
  <div class="shell">
    <main id="discover">
      <div class="controls">
        <nav class="tabs" aria-label="视频分区">
          <button data-tab="daily" class="on">本期</button>
          <button data-tab="archive">全部入选</button>
          <button data-tab="saved">我的认可</button>
        </nav>
        <div class="searchbox">
          <span aria-hidden="true">⌕</span>
          <input id="search" aria-label="搜索入选作品" placeholder="标题 / UP / BV号" maxlength="120" autocomplete="off">
        </div>
      </div>
      <div class="catalog-layout">
        <section class="catalog-main">
          <div class="section-heading">
            <div><h2 id="section-title">本期入选</h2><p id="section-sub"></p></div>
            <span class="page-label" id="count"></span>
          </div>
          <div class="notice" id="message" role="status" aria-live="polite"></div>
          <div class="grid" id="grid"></div>
          <nav class="pager" aria-label="目录翻页">
            <button id="prev" aria-label="上一页" title="上一页" disabled>‹</button>
            <span id="page-label" aria-live="polite">1 / 1</span>
            <button id="next" aria-label="下一页" title="下一页">›</button>
          </nav>
        </section>
        <aside class="catalog-aside">
          <section class="calendar-panel">
            <div class="calendar-heading">
              <h3>放映日历</h3>
              <span class="ticket-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            </div>
            <div class="calendar-month">
              <button id="calendar-prev" aria-label="上个月">‹</button>
              <strong id="calendar-month"></strong>
              <button id="calendar-next" aria-label="下个月">›</button>
            </div>
            <div class="calendar-week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
            <div class="calendar-days" id="calendar-days"></div>
            <p class="calendar-occasion" id="calendar-occasion" hidden></p>
            <div class="calendar-selected">
              <span id="calendar-selected-date"></span>
              <span id="calendar-selected-count"></span>
              <button id="calendar-today" title="回到最近上架日">最近</button>
            </div>
          </section>
          <section class="record-panel">
            <div class="record-heading"><h3>結束バンド</h3><span id="music-kind"></span></div>
            <div class="turntable" id="turntable">
              <div class="turntable-plate"><div class="vinyl"><div class="record-label"><span>33⅓</span><img id="record-art" alt="" hidden></div></div></div>
              <div class="tonearm"><i></i></div><div class="power-led"></div>
              <div class="deck-strobe" aria-hidden="true"></div><span class="deck-type">33⅓ · STEREO</span>
            </div>
            <div class="music-sleeve">
              <img id="sleeve-art" alt="" width="43" height="43" hidden>
              <div><strong id="music-title"></strong><small id="music-album"></small></div>
            </div>
            <select id="music-track" aria-label="选择曲目"></select>
            <div class="music-transport">
              <button id="music-prev" aria-label="上一首">‹</button>
              <button id="music-play" aria-label="播放">▶</button>
              <button id="music-next" aria-label="下一首">›</button>
            </div>
            <input id="music-seek" type="range" min="0" max="1000" value="0" aria-label="播放进度">
            <div class="music-times"><span id="music-elapsed">0:00</span><span id="music-duration">—</span></div>
            <div class="music-bottom">
              <label>音量<input id="music-volume" type="range" min="0" max="1" step="0.01" value="0.25" aria-label="音量"></label>
              <button id="music-preview" hidden>试听</button>
              <a id="music-download" target="_blank" rel="noopener" hidden>购买下载 ↗</a>
            </div>
            <div class="local-audio">
              <label>打开本地音频<input type="file" id="music-local" accept="audio/*,.flac,.m4a,.mp3" multiple hidden></label>
              <button id="music-official" hidden>返回试听</button>
            </div>
            <p class="music-message" id="music-message" role="status"></p>
            <audio id="music-audio" preload="none"></audio>
          </section>
        </aside>
      </div>
    </main>
    <footer class="footer" id="page-end">
      <details>
        <summary>关于收录与更新</summary>
        <p id="collection-note"></p>
        <p>作品经复核后上架，日历记录上架日。每天北京时间 12:00 更新采集数据，依赖本机开机联网。标注保存在当前浏览器。</p>
        <p>页头为同人插画，唱片封面来自发行方曲库。</p>
      </details>
      <div class="utility">
        <button id="export">导出标注</button>
        <label class="filelabel">导入标注<input id="import" type="file" accept=".json" hidden></label>
        <button id="undo">撤销上次</button>
        <a href="web/ecosystem-report.html">原调查报告</a>
      </div>
    </footer>
  </div>
  <button class="jump-end" id="jump-end" aria-label="跳到页尾" title="跳到页尾">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M10 3v10m-4-4 4 4 4-4M5 16h10"/></svg>
  </button>
  <dialog class="full-player" id="full-player" aria-labelledby="full-track-title">
    <header><h3 id="full-track-title"></h3><button id="close-full-player" type="button" aria-label="关闭播放器">×</button></header>
    <div id="full-player-frame"></div>
    <a id="full-track-link" target="_blank" rel="noopener">在 YouTube 打开 ↗</a>
  </dialog>
<dialog id="review-dialog"><form id="review-form"><h3 id="review-title">记录你的判断</h3><p class="review-note" id="review-note"></p><div class="form-columns"><div><label for="craft">制作的独到之处</label><select id="craft" required><option value="">暂不评分</option value="0">0 · 缺乏打磨</option><option value="1">1 · 合格</option><option value="2">2 · 明显独到</option><option value="3">3 · 出色且难替代</option></select></div><div><label for="resonance">表达带来的共鸣</label><select id="resonance" required><option value="">暂不评分</option><option value="0">0 · 无感</option><option value="1">1 · 有趣但浅</option><option value="2">2 · 留下清楚回响</option><option value="3">3 · 强烈且持久</option></select></div></div><label for="reason">主要认可理由</label><select id="reason" required><option value="">请选择</option><option value="craft_expression">制作 / 表达本身</option><option value="sentiment_only">主要是感动 / 同情</option><option value="effort_only">主要是辛苦 / 肝</option><option value="utility_only">主要是有用 / 想收藏</option><option value="other">其他 / 不认可</option></select><label for="evidence">具体片段与理由</label><textarea id="evidence" required maxlength="2000" placeholder="哪一段、哪种处理，让你留下了这个判断？"></textarea><label class="checked"><input type="checkbox" id="watched" required>我已经观看，足以作出判断</label><div class="dialog-actions"><button type="submit">保存判断</button><button type="button" id="clear-review">移除判断</button><button type="button" id="close-review">返回浏览</button></div></form></dialog>

  <script id="payload" type="application/json">__BOOT__</script>
  <script>__UI__</script>
</body>
</html>
